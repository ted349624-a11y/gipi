<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GiphyFun Whitelist</title>
<meta name="description" content="Complete the tasks on X and claim early access on the GiphyFun whitelist.">

<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta name="twitter:title" content="GiphyFun Whitelist">
<meta name="twitter:description" content="Complete the tasks on X and claim early access.">
<meta name="twitter:image" content="og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one holographic card, centered on black. The lower part of the card is a deck of tasks shown one at a time; when the last is done the card spins and lands on its back, which carries Early Access and the referral link. Single dark look by choice, colors taken from the logo. */
  :root {
    --bg: #050507;
    --card: #0a0a10;
    --slip: #15151f;
    --line: rgba(255,255,255,.14);
    --fg: #f5f4ff;
    --muted: #a2a3bd;
    --on-neon: #0a0a12;
    --bad: #ff5f8a;
    --y: #ffe95a; --g: #7cff6b; --c: #2bd4ff; --v: #7a6cff; --m: #e04bff; --p: #ff5fa2;
    --rainbow: linear-gradient(100deg, var(--y), var(--g), var(--c), var(--v), var(--m), var(--p));
    --holo: linear-gradient(115deg, transparent 36%, rgba(255,95,162,.5) 42%, rgba(255,233,90,.45) 47%, rgba(124,255,107,.4) 51%, rgba(43,212,255,.5) 55%, rgba(122,108,255,.5) 60%, transparent 66%);
    --sans: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --rx: 0deg; --ry: 0deg; --hx: 30%; --hy: 20%; --prog: 0;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.4; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg .clouds { position: absolute; left: 0; right: 0; bottom: 0; height: 46vh; min-height: 240px; background: url("assets/clouds.jpg") center bottom / cover no-repeat; opacity: .5;
    -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%); }

  .page { position: relative; z-index: 1; min-height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- the card ---------- */
  .scene { position: relative; perspective: 1200px; width: min(340px, 100%); }
  .aura { position: absolute; inset: -12%; border-radius: 50%; z-index: -1; filter: blur(46px);
    background: conic-gradient(from 0deg, var(--y), var(--g), var(--c), var(--v), var(--m), var(--p), var(--y));
    opacity: calc(.28 + var(--prog) * .4); animation: turn 14s linear infinite; transition: opacity .8s; }
  @keyframes turn { to { transform: rotate(360deg) } }
  .tilt { transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d; will-change: transform; }
  .flipper { position: relative; aspect-ratio: 10 / 16; transform-style: preserve-3d; }
  .flipper.flipped { transform: rotateY(180deg); }
  /* Faces are hidden explicitly: some mobile browsers ignore backface-visibility on clipped, blended layers. */
  .flipper:not(.flipped) .back, .flipper.flipped .front { visibility: hidden; }

  .face { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: var(--card);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.06);
    display: flex; flex-direction: column; padding: 18px; gap: 12px; }
  .back { transform: rotateY(180deg); }
  .flipper:not(.flipped) .back, .flipper.flipped .front, .flipper.spin .face { pointer-events: none; }
  .face::before { content: ""; position: absolute; inset: -20%; background: var(--holo); background-size: 240% 240%; background-position: var(--hx) var(--hy);
    mix-blend-mode: color-dodge; opacity: calc(.3 + var(--prog) * .3); pointer-events: none; }
  .face::after { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none; background: var(--rainbow);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: calc(.45 + var(--prog) * .55); }
  .face > * { position: relative; z-index: 1; }

  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 28px; }
  .bar .l { display: flex; align-items: center; gap: 8px; }
  .brand { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,.75); }
  .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .prev { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--fg); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .prev:hover { border-color: var(--fg); }
  svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .prev svg { width: 14px; height: 14px; stroke-width: 2.2; }

  .art { flex: 1; min-height: 0; display: grid; place-items: center; }
  .art img { width: 62%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 26px rgba(122,108,255,.55)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }

  .segs { display: flex; gap: 5px; }
  .segs i { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); transition: background .4s, box-shadow .4s; }
  .segs i.on { background: var(--sc); box-shadow: 0 0 10px var(--sc); }
  .segs i.now { background: rgba(255,255,255,.45); }

  /* ---------- task deck ---------- */
  .deck { position: relative; height: 150px; flex: none; }
  .deck::before, .deck::after { content: ""; position: absolute; left: 0; right: 0; height: 100%; border-radius: 18px; background: var(--slip); border: 1px solid var(--line); }
  .deck::before { transform: translateY(12px) scale(.9); opacity: .35; }
  .deck::after { transform: translateY(6px) scale(.95); opacity: .6; }
  .deck.last::before, .deck.last::after { opacity: 0; }
  .deck.one::before { opacity: 0; }
  .slip { position: absolute; inset: 0; z-index: 2; border-radius: 18px; background: var(--slip); border: 1px solid rgba(255,255,255,.2); padding: 14px;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
  .slip.enter { transform: translateY(125%); }
  .slip.enter.rev { transform: translateY(-20px) scale(.92); opacity: 0; }
  .slip.leave { transform: translateY(-14px) scale(.92); opacity: 0; z-index: 1; }
  .slip.leave.rev { transform: translateY(125%); opacity: 1; z-index: 3; }
  .st { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ico { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--on-neon); background: var(--sc, var(--c)); box-shadow: 0 0 14px var(--sc, var(--c)); }
  .ico svg { width: 15px; height: 15px; stroke-width: 2; }
  .tt { font-size: 17px; font-weight: 600; letter-spacing: -.01em; min-width: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .hint.err { color: var(--bad); }

  .field { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; min-width: 0; transition: border-color .2s, box-shadow .2s; }
  .field:focus-within { border-color: var(--c); box-shadow: 0 0 0 3px rgba(43,212,255,.18); }
  .field.bad { border-color: var(--bad); animation: shake .4s; }
  .field.busy { opacity: .6; pointer-events: none; }
  @keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(5px) } 60% { transform: translateX(-3px) } 80% { transform: translateX(2px) } }
  .field .pre { color: var(--muted); }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--fg); font: 500 16px var(--sans); padding: 8px 0; }
  /* 16px keeps iOS from zooming the page when the field is focused */
  .field input.addr { font: 500 16px var(--mono); letter-spacing: -.04em; }
  .field input::placeholder { color: rgba(162,163,189,.6); }
  .go { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0;
    color: var(--muted); background: rgba(255,255,255,.1); transition: .25s; }
  .go svg { width: 17px; height: 17px; stroke-width: 2.2; }
  .field.ok .go { color: var(--on-neon); background: var(--rainbow); box-shadow: 0 0 18px rgba(43,212,255,.5); }

  .acts { display: flex; align-items: center; gap: 12px; }
  .btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; text-decoration: none;
    font: 600 15px var(--sans); color: var(--on-neon); background: var(--rainbow); background-size: 180% 100%; transition: background-position .5s, transform .15s, box-shadow .3s; }
  .btn:hover { background-position: 100% 0; transform: translateY(-1px); box-shadow: 0 8px 26px rgba(122,108,255,.45); }
  .btn:active { transform: translateY(1px); }
  .btn.line { background: none; color: var(--fg); border: 1px solid rgba(255,255,255,.35); }
  .btn.line:hover { border-color: var(--fg); box-shadow: none; }
  .btn svg { width: 16px; height: 16px; stroke-width: 2.4; }
  .mini { flex: none; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; cursor: pointer; font-family: var(--sans); padding: 6px 2px; }
  .mini:hover { color: var(--fg); }

  /* ---------- back ---------- */
  .back .art { flex: none; padding-top: 6px; }
  .back .art img { width: 36%; }
  .early { font-size: clamp(40px, 13vw, 52px); line-height: .95; font-weight: 700; letter-spacing: -.03em; text-align: center;
    background: var(--rainbow); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: slide 5s linear infinite alternate; }
  @keyframes slide { to { background-position: 100% 0 } }
  .who { text-align: center; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .spacer { flex: 1; min-height: 0; }
  .reflabel { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .reflink { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border: 1px dashed rgba(255,255,255,.28); border-radius: 14px; padding: 8px 8px 8px 12px; min-width: 0; }
  .reflink code { flex: 1; min-width: 0; font: 500 11.5px/1.35 var(--mono); color: var(--c); overflow-wrap: anywhere; user-select: all; max-height: 4.1em; overflow: hidden; }
  .copy { flex: none; border: 0; border-radius: 10px; padding: 9px 12px; cursor: pointer; font: 600 13px var(--sans); color: var(--on-neon); background: var(--y); transition: .2s; }
  .copy.ok { background: var(--g); }
  .back .mini { align-self: center; }

  .note { font-size: 13px; color: var(--muted); margin: 0; text-align: center; }
  .note b { color: var(--fg); font-weight: 600; }

  :is(a, button, input):focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .field input:focus-visible { outline: none; }

  @media (prefers-reduced-motion: reduce) {
    .aura, .art img, .early, .field.bad { animation: none; }
    .slip { transition: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="clouds"></div></div>

<main class="page">
  <div class="scene" id="scene">
    <div class="aura" aria-hidden="true"></div>
    <div class="tilt">
      <div class="flipper" id="flipper">

        <section class="face front" aria-label="Whitelist tasks">
          <div class="bar">
            <div class="l">
              <button class="prev" id="prevBtn" type="button" aria-label="Previous step" hidden><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
              <span class="brand">GiphyFun</span>
            </div>
            <span class="count" id="count">1 / 7</span>
          </div>
          <div class="art"><img src="assets/logo.webp" alt="GiphyFun logo"></div>
          <div class="segs" id="segs" aria-hidden="true"></div>
          <div class="deck" id="deck"></div>
        </section>

        <section class="face back" aria-label="Early access">
          <div class="bar"><span class="brand">GiphyFun</span><span class="count">Whitelist</span></div>
          <div class="art"><img src="assets/logo.webp" alt=""></div>
          <div class="early">Early<br>Access</div>
          <div class="who" id="who"></div>
          <div class="spacer"></div>
          <div class="reflabel">Your referral link</div>
          <div class="reflink"><code id="refLink">…</code><button class="copy" id="copyBtn" type="button">Copy</button></div>
          <div class="acts"><a class="btn" id="shareX" href="#" target="_blank" rel="noopener">Share on X</a></div>
          <button class="mini" id="resetBtn" type="button">Start over</button>
        </section>

      </div>
    </div>
  </div>
  <p class="note" id="invitedBy" hidden>Invited by <b id="refName"></b></p>
</main>

<script>
/* ===== SETTINGS ===== */
const CONFIG = {
  handle: 'giphydotfun',
  POST_URL: ''   /* put the new post link here; until then the post tasks open the profile */
};
/* ==================== */

const profile = 'https://x.com/' + CONFIG.handle;
const postId = (CONFIG.POST_URL.match(/status\/(\d+)/) || [])[1] || '';
/* Until POST_URL is set, the post tasks open the profile. */
const postUrl = postId ? CONFIG.POST_URL : profile;
const replyUrl = postId ? 'https://x.com/intent/post?in_reply_to=' + postId : profile;

const validUser = u => /^[A-Za-z0-9_]{1,15}$/.test(u);
const validWallet = a => /^0x[a-fA-F0-9]{40}$/.test(a) || /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);

const I = {
  user:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M5 20c.7-3.8 3.5-5.8 7-5.800s6.3 2 7 5.8"/></svg>',
  follow: '<svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.6"/><path d="M3.5 20c.6-3.6 3.2-5.6 6.5-5.600s5.9 2 6.5 5.600M19 7v6M16 10h6"/></svg>',
  bell:   '<svg viewBox="0 0 24 24"><path d="M6 16.500V11a6 6 0 0 1 12 0v5.500l1.5 2h-15zM10 20.500a2.2 2.2 0 0 0 4 0"/></svg>',
  like:   '<svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></svg>',
  rt:     '<svg viewBox="0 0 24 24"><path d="M4.5 13V9.500a3 3 0 0 1 3-3H17M14 3.500l3 3-3 3M19.5 11v3.500a3 3 0 0 1-3 3H7M10 20.500l-3-3 3-3"/></svg>',
  reply:  '<svg viewBox="0 0 24 24"><path d="M4 11.500A7.5 7.5 0 0 1 11.5 4h1a7.5 7.5 0 0 1 2 14.700L9 21v-2.600A7.5 7.5 0 0 1 4 11.500z"/></svg>',
  wallet: '<svg viewBox="0 0 24 24"><path d="M4 7.500A2.5 2.5 0 0 1 6.5 5H17v3M4 7.500V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6.500A2.5 2.5 0 0 1 4 7.500zM16 13.500h.01"/></svg>',
  arrow:  '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  check:  '<svg viewBox="0 0 24 24"><path d="M5 12.500l4.5 4.500L19 7.5"/></svg>'
};
const SEG = ['var(--y)','var(--g)','var(--c)','var(--v)','var(--m)','var(--p)','var(--y)'];

/* The comment task only opens X: people write their own words. */
const STEPS = [
  { id:'user',   type:'input', t:'Your X username', pre:'@', ph:'username', max:16, key:'user', valid:validUser, clean:v => v.trim().replace(/^@/, ''), err:'1–15 letters, numbers or _' },
  { id:'follow', type:'link',  t:'Follow @' + CONFIG.handle, href:profile },
  { id:'bell',   type:'link',  t:'Turn on notifications', href:profile },
  { id:'like',   type:'link',  t:'Like the post', href:postUrl },
  { id:'rt',     type:'link',  t:'Repost', href:postUrl },
  { id:'reply',  type:'link',  t:'Comment', hint:'Write it in your own words.', href:replyUrl },
  { id:'wallet', type:'input', t:'Robinhood Wallet address', ph:'0x…', max:64, key:'wallet', addr:true, valid:validWallet, clean:v => v.trim(),
    hint:'Public address only, never a seed phrase.', err:'That does not look like a wallet address.' }
];
const N = STEPS.length;

const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem('gf3_'+k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem('gf3_'+k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem('gf3_'+k); } catch {} }
};
let state = { step: Math.min(N, store.get('step') || 0), user: store.get('user') || '', wallet: store.get('wallet') || '', opened: store.get('opened') || {} };
if (!validUser(state.user)) state.step = 0;

const deck = $('#deck'), flipper = $('#flipper'), root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const refLink = () => location.origin + location.pathname + '#ref-' + state.user;

/* Arrived via referral? (#ref-username) */
(function(){
  const m = location.hash.match(/^#ref-([A-Za-z0-9_]{1,15})$/);
  if (m) store.set('referrer', m[1]);
  const r = store.get('referrer');
  if (r && r !== state.user) { $('#refName').textContent = '@' + r; $('#invitedBy').hidden = false; }
})();

/* ---------- deck ---------- */
$('#segs').innerHTML = STEPS.map((_, i) => `<i style="--sc:${SEG[i]}"></i>`).join('');

function chrome(){
  const s = Math.min(state.step, N);
  [...$('#segs').children].forEach((el, i) => { el.classList.toggle('on', i < s); el.classList.toggle('now', i === s); });
  $('#count').textContent = Math.min(s + 1, N) + ' / ' + N;
  $('#prevBtn').hidden = s === 0;
  deck.classList.toggle('last', s >= N - 1); deck.classList.toggle('one', s === N - 2);
  root.style.setProperty('--prog', (s / N).toFixed(3));
}

function fillSlip(el, i){
  const st = STEPS[i];
  const head = `<div class="st"><span class="ico">${I[st.id]}</span><span class="tt">${st.t}</span></div>`;
  if (st.type === 'input') {
    el.innerHTML = head +
      `<div class="field"><span class="pre">${st.pre || ''}</span><input id="in_${st.id}" class="${st.addr ? 'addr' : ''}" type="text" placeholder="${st.ph}" aria-label="${st.t}" maxlength="${st.max}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="go" type="button" aria-label="Continue">${I.arrow}</button></div>` +
      `<p class="hint">${st.hint || ''}</p>`;
    const field = el.querySelector('.field'), input = el.querySelector('input'), hint = el.querySelector('.hint');
    if (!st.pre) el.querySelector('.pre').remove();
    input.value = state[st.key] || '';
    const sync = () => { field.classList.remove('bad'); field.classList.toggle('ok', st.valid(st.clean(input.value))); hint.textContent = st.hint || ''; hint.classList.remove('err'); };
    const submit = () => {
      const v = st.clean(input.value);
      if (!st.valid(v)) { field.classList.remove('bad'); void field.offsetWidth; field.classList.add('bad'); hint.textContent = st.err; hint.classList.add('err'); input.focus(); return; }
      state[st.key] = v; store.set(st.key, v);
      if (st.id !== 'wallet') return next();
      /* Last step: save the sign-up, then flip the card. */
      if (field.classList.contains('busy')) return;
      field.classList.add('busy'); hint.textContent = 'Saving…'; hint.classList.remove('err');
      join().then(() => next())
        .catch(e => { hint.textContent = e.message || 'Could not save. Try again.'; hint.classList.add('err'); })
        .finally(() => field.classList.remove('busy'));
    };
    input.addEventListener('input', sync);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    el.querySelector('.go').addEventListener('click', submit);
    sync();
  } else {
    const opened = !!state.opened[st.id];
    el.innerHTML = head + (st.hint ? `<p class="hint">${st.hint}</p>` : '') + (opened
      ? `<div class="acts"><button class="btn done" type="button">${I.check} Done</button><a class="mini" href="${st.href}" target="_blank" rel="noopener">Open again ↗</a></div>`
      : `<div class="acts"><a class="btn line" href="${st.href}" target="_blank" rel="noopener">Open on X ↗</a></div>`);
    el.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      if (state.opened[st.id]) return;
      state.opened[st.id] = true; store.set('opened', state.opened);
      setTimeout(() => { if (state.step === i) fillSlip(el, i); }, 350);
    }));
    const done = el.querySelector('.done'); if (done) done.addEventListener('click', next);
  }
}

function showStep(i, dir){
  const old = deck.querySelector('.slip:not(.leave)');
  const el = document.createElement('div');
  el.className = 'slip'; el.style.setProperty('--sc', SEG[i]);
  fillSlip(el, i);
  if (old && dir && !reduce) {
    el.classList.add('enter'); if (dir < 0) el.classList.add('rev');
    deck.appendChild(el); void el.offsetWidth; el.classList.remove('enter', 'rev');
    old.classList.add('leave'); if (dir < 0) old.classList.add('rev');
    old.querySelectorAll('a, button, input').forEach(n => n.tabIndex = -1);
    setTimeout(() => old.remove(), 520);
  } else { if (old) old.remove(); deck.appendChild(el); }
  chrome();
  const inp = el.querySelector('input');
  if (inp && dir && matchMedia('(hover: hover)').matches) setTimeout(() => inp.focus({ preventScroll: true }), 380);
}

/* ---------- server: sign-ups are stored through /api (Upstash Redis on Vercel) ---------- */
async function join(){
  let r;
  try {
    r = await fetch('/api/join', { method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ user: state.user, wallet: state.wallet, ref: store.get('referrer') || '' }) });
  } catch { throw new Error('No connection. Try again.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Could not save. Try again.');
  state.refs = j.refs || 0;
}
function loadRefs(){
  fetch('/api/me?user=' + encodeURIComponent(state.user)).then(r => r.ok ? r.json() : null)
    .then(j => { if (j) { state.refs = j.refs; showWho(); } }).catch(() => {});
}
function showWho(){
  const n = state.refs || 0;
  $('#who').textContent = '@' + state.user + ' · ' + n + (n === 1 ? ' referral' : ' referrals');
}

function next(){
  state.step++; store.set('step', state.step);
  if (state.step >= N) finish(true); else showStep(state.step, 1);
}
$('#prevBtn').addEventListener('click', () => { if (state.step > 0) { state.step--; store.set('step', state.step); showStep(state.step, -1); } });

/* ---------- back of the card ---------- */
function fillBack(){
  showWho();
  $('#refLink').textContent = refLink();
  const text = 'I just got early access on the GiphyFun whitelist! Join me: ' + refLink() + ' @' + CONFIG.handle;
  $('#shareX').href = 'https://x.com/intent/post?text=' + encodeURIComponent(text);
}
function finish(animate){
  fillBack(); chrome(); root.style.setProperty('--prog', '1');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (!animate || reduce) { flipper.classList.add('flipped'); return; }
  /* Spin 540deg and land on the back; swap which face is shown whenever the card passes edge-on. */
  const front = $('.front'), back = $('.back'), t0 = performance.now(), dur = 1500;
  flipper.classList.add('spin');
  (function step(now){
    const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const a = e * 540, showBack = Math.cos(a * Math.PI / 180) < 0;
    flipper.style.transform = 'rotateY(' + a.toFixed(1) + 'deg) scale(' + (1 + Math.sin(k * Math.PI) * .07).toFixed(3) + ')';
    front.style.visibility = showBack ? 'hidden' : 'visible';
    back.style.visibility = showBack ? 'visible' : 'hidden';
    if (k < 1) requestAnimationFrame(step);
    else { flipper.classList.add('flipped'); flipper.classList.remove('spin'); flipper.style.transform = ''; front.style.visibility = ''; back.style.visibility = ''; }
  })(t0);
}

$('#copyBtn').addEventListener('click', e => {
  const b = e.currentTarget, ok = () => { b.textContent = 'Copied'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1600); };
  navigator.clipboard.writeText(refLink()).then(ok)
    .catch(() => { const r = document.createRange(); r.selectNodeContents($('#refLink')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
});
$('#resetBtn').addEventListener('click', () => {
  ['step','user','wallet','opened'].forEach(store.del); state = { step:0, user:'', wallet:'', opened:{} };
  flipper.classList.remove('flipped', 'spin'); showStep(0, 0);
});

/* ---------- tilt + holo sheen: follows the mouse, sways on its own on touch ---------- */
(function(){
  let mx = 0, my = 0, tx = 0, ty = 0, mouse = false;
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; mouse = true; tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, { passive: true });
  document.addEventListener('pointerleave', () => { tx = 0; ty = 0; });
  if (reduce) return;
  (function loop(ms){
    const t = ms / 1000;
    if (!mouse) { tx = Math.sin(t * .7) * .55; ty = Math.cos(t * .5) * .4; }
    mx += (tx - mx) * .07; my += (ty - my) * .07;
    const typing = document.activeElement && document.activeElement.tagName === 'INPUT', k = typing ? .25 : 1;
    root.style.setProperty('--ry', (mx * 13 * k).toFixed(2) + 'deg');
    root.style.setProperty('--rx', (-my * 9 * k).toFixed(2) + 'deg');
    root.style.setProperty('--hx', (50 + mx * 50).toFixed(1) + '%');
    root.style.setProperty('--hy', (50 + my * 50).toFixed(1) + '%');
    requestAnimationFrame(loop);
  })(0);
})();

/* ---------- boot ---------- */
if (state.step >= N) { showStep(N - 1, 0); finish(false); loadRefs(); } else showStep(state.step, 0);
</script>
