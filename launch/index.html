<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GiphyFun Launches</title>
<meta name="description" content="Launch and discover tokens on GiphyFun.">
<meta name="theme-color" content="#050507">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
  /* Layout: black night sky from the whitelist card. Header, one loud rainbow action, a holographic trending rail, then a quiet sortable list. Single dark look by choice. */
  :root {
    --bg: #050507;
    --panel: #0e0e15;
    --panel-2: #15151f;
    --line: rgba(255,255,255,.1);
    --line-2: rgba(255,255,255,.2);
    --fg: #f5f4ff;
    --muted: #9a9bb8;
    --on-neon: #0a0a12;
    --up: #7cff6b;
    --down: #ff6f7d;
    --y: #ffe95a; --g: #7cff6b; --c: #2bd4ff; --v: #7a6cff; --m: #e04bff; --p: #ff5fa2;
    --rainbow: linear-gradient(100deg, var(--y), var(--g), var(--c), var(--v), var(--m), var(--p));
    --holo: linear-gradient(115deg, transparent 34%, rgba(255,95,162,.55) 42%, rgba(255,233,90,.5) 47%, rgba(124,255,107,.45) 51%, rgba(43,212,255,.55) 55%, rgba(122,108,255,.55) 60%, transparent 68%);
    --sans: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.4; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  svg { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .sky::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44vh; min-height: 220px; background: url("/assets/clouds.jpg") center bottom / cover no-repeat; opacity: .32;
    -webkit-mask-image: linear-gradient(transparent, #000 75%); mask-image: linear-gradient(transparent, #000 75%); }
  .sky::after { content: ""; position: absolute; width: 70vmax; height: 70vmax; left: 50%; top: -42vmax; transform: translateX(-50%); border-radius: 50%; filter: blur(90px); opacity: .22;
    background: conic-gradient(var(--y), var(--g), var(--c), var(--v), var(--m), var(--p), var(--y)); animation: turn 30s linear infinite; }
  @keyframes turn { to { transform: translateX(-50%) rotate(360deg) } }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-block: 0 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; position: sticky; top: 0; z-index: 5;
    background: linear-gradient(var(--bg) 70%, transparent); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
  .brand img { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(122,108,255,.6)); }
  .tools { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .search { display: flex; align-items: center; gap: 8px; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); padding: 0 12px; min-width: 0; transition: border-color .2s, width .3s; width: 42px; overflow: hidden; }
  .search.open, .search:focus-within { width: min(240px, 46vw); border-color: var(--c); }
  .search svg { flex: none; width: 18px; height: 18px; color: var(--muted); cursor: pointer; }
  .search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; }
  .icon { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; color: var(--fg); padding: 0; flex: none; transition: border-color .2s; }
  .icon:hover { border-color: var(--line-2); }
  .icon svg { width: 18px; height: 18px; }

  /* ---------- hero ---------- */
  .hero { display: grid; gap: 16px; justify-items: start; padding: 18px 0 28px; }
  .hero h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); line-height: 1; font-weight: 700; letter-spacing: -.03em; }
  .hero h1 span { background: var(--rainbow); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: slide 6s linear infinite alternate; }
  @keyframes slide { to { background-position: 100% 0 } }
  .hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .cta { border: 0; border-radius: 16px; padding: 15px 24px; font-weight: 700; font-size: 17px; color: var(--on-neon); cursor: pointer;
    background: var(--rainbow); background-size: 200% 100%; animation: slide 4s linear infinite alternate; transition: transform .15s, box-shadow .3s; box-shadow: 0 10px 34px rgba(122,108,255,.35); }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 14px 44px rgba(122,108,255,.55); }
  .cta:active { transform: translateY(1px); }
  .sample { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 999px; padding: 6px 12px; }

  /* ---------- trending ---------- */
  .sec { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .sec h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  .arrows { display: flex; gap: 8px; }
  .rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 4px 0 8px; margin: 0 -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
  .rail::-webkit-scrollbar { display: none; }
  .tcard { flex: none; width: min(230px, 62vw); scroll-snap-align: start; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
  .art { position: relative; aspect-ratio: 1; border-radius: 26px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; transition: transform .35s cubic-bezier(.2,.8,.2,1), border-color .3s; }
  .tcard:hover .art { transform: translateY(-4px) rotate(-1deg); border-color: var(--line-2); }
  .art::after { content: ""; position: absolute; inset: -30%; background: var(--holo); background-size: 250% 250%; mix-blend-mode: color-dodge; opacity: .4; animation: sheen 5s ease-in-out infinite; animation-delay: var(--d, 0s); pointer-events: none; }
  @keyframes sheen { 0%, 100% { background-position: 0% 0% } 50% { background-position: 100% 100% } }
  .coin { width: 56%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: clamp(34px, 9vw, 52px); color: var(--on-neon);
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.75), transparent 45%), linear-gradient(140deg, var(--a), var(--b));
    box-shadow: 0 0 40px color-mix(in srgb, var(--a) 55%, transparent), inset 0 -8px 18px rgba(0,0,0,.25); animation: bob 5s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .tmeta { padding: 12px 4px 0; display: grid; gap: 2px; }
  .tname { font-size: 17px; font-weight: 600; display: flex; gap: 8px; min-width: 0; }
  .tname i { font-style: normal; color: var(--muted); font-weight: 500; }
  .tname b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tnum { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .tnum strong { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .chg { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }

  /* ---------- tabs + filters ---------- */
  .tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 34px; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; background: none; border: 0; padding: 12px 14px; font-size: 16px; font-weight: 500; color: var(--muted); cursor: pointer; transition: color .2s; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); font-weight: 600; }
  .ink { position: absolute; bottom: 0; left: 0; height: 2px; width: 40px; background: var(--rainbow); border-radius: 2px; transition: transform .35s cubic-bezier(.2,.8,.2,1), width .35s cubic-bezier(.2,.8,.2,1); }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 0; align-items: center; }
  .select { position: relative; }
  .select select { appearance: none; -webkit-appearance: none; height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); padding: 0 38px 0 16px; cursor: pointer; font-size: 15px; }
  .select svg { position: absolute; right: 14px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
  .view { display: flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 3px; }
  .view button { width: 40px; height: 34px; border: 0; border-radius: 999px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); padding: 0; }
  .view button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
  .view svg { width: 16px; height: 16px; }
  .count { margin-left: auto; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

  /* ---------- list ---------- */
  .list { display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 18px; background: rgba(14,14,21,.72); border: 1px solid var(--line);
    cursor: pointer; text-align: left; color: inherit; width: 100%; transition: border-color .2s, transform .2s, background .2s; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes rise { from { transform: translateY(10px); opacity: .01 } to { transform: none; opacity: 1 } }
  .row:hover { border-color: var(--line-2); background: var(--panel-2); transform: translateX(2px); }
  .ava { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-weight: 700; font-size: 22px; color: var(--on-neon);
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.7), transparent 45%), linear-gradient(140deg, var(--a), var(--b)); }
  .info { min-width: 0; display: grid; gap: 3px; }
  .nm { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; min-width: 0; }
  .nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk { color: var(--muted); font-size: 13px; font-weight: 500; flex: none; }
  .grad { flex: none; color: var(--g); font-weight: 600; }
  .sub { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; min-width: 0; white-space: nowrap; }
  .sub .by { overflow: hidden; text-overflow: ellipsis; }
  .bar { flex: 1; max-width: 120px; min-width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--rainbow); border-radius: 4px; }
  .val { text-align: right; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  .val strong { font-size: 17px; font-weight: 600; transition: color .6s; }
  .val strong.tick-up { color: var(--up); transition: none; } .val strong.tick-down { color: var(--down); transition: none; }
  .list.grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .list.grid .row { grid-template-columns: minmax(0, 1fr); justify-items: start; gap: 10px; padding: 14px; }
  .list.grid .row:hover { transform: translateY(-3px); }
  .list.grid .ava { width: 100%; height: auto; aspect-ratio: 1; border-radius: 16px; font-size: 44px; }
  .list.grid .val { text-align: left; }
  .list.grid .sub .bar { display: none; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; border: 1px dashed var(--line); border-radius: 18px; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: grid; align-items: end; justify-items: center; animation: fade .2s both; }
  @keyframes fade { from { opacity: 0 } }
  .sheet { width: min(480px, 100%); max-height: 92vh; overflow-y: auto; overflow-x: hidden; background: var(--panel); border: 1px solid var(--line-2); border-radius: 26px 26px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
    display: grid; gap: 14px; animation: up .35s cubic-bezier(.2,.8,.2,1) both; position: relative; }
  .sheet::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 2px; background: var(--rainbow); border-radius: 2px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0 } }
  @media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 26px; } }
  .sh { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sh h3 { margin: 0; font-size: 22px; font-weight: 600; }
  .f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 500; min-width: 0; }
  .f input, .f textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 16px var(--sans); color: var(--fg); outline: none; resize: vertical; width: 100%; min-width: 0; }
  .f input:focus, .f textarea:focus { border-color: var(--c); box-shadow: 0 0 0 3px rgba(43,212,255,.16); }
  .two { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; }
  .prev { display: flex; align-items: center; gap: 12px; border: 1px dashed var(--line-2); border-radius: 16px; padding: 12px; min-width: 0; }
  .prev .info b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .msg { margin: 0; font-size: 14px; color: var(--muted); }
  .msg.warn { color: var(--y); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { background: var(--panel-2); border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

  :is(a, button, input, select, textarea):focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .search input:focus-visible { outline: none; }
  @media (prefers-reduced-motion: reduce) {
    .sky::after, .hero h1 span, .cta, .art::after, .coin, .row, .scrim, .sheet { animation: none; }
    .ink { transition: none; }
  }

  /* ---------- real coins: GIF art, launch form ---------- */
  .ava, .coin { overflow: hidden; }
  .ava img, .coin img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art .coin { width: 100%; border-radius: 0; box-shadow: none; animation: none; background: var(--panel-2); }
  .feeTag { font-size: 13px; color: var(--muted); }
  .drop { position: relative; display: flex; align-items: center; gap: 12px; border: 1px dashed var(--line-2); border-radius: 14px; padding: 12px; cursor: pointer; color: var(--muted); font-size: 14px; min-width: 0; }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--c); color: var(--fg); }
  .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .drop .ava { flex: none; }
  .drop b { color: var(--fg); font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drop > span:nth-child(2) { min-width: 0; }
  .feeRow { display: flex; align-items: center; gap: 12px; }
  .f .feeRow input[type=range] { flex: 1; min-width: 0; accent-color: var(--m); padding: 0; border: 0; background: none; box-shadow: none; }
  .feeRow output { flex: none; width: 56px; text-align: right; font-weight: 600; font-size: 16px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .cta[disabled] { opacity: .5; cursor: progress; transform: none; animation: none; }
  .msg.err { color: var(--down); } .msg.ok { color: var(--up); }
  .addr { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--c); overflow-wrap: anywhere; user-select: all; }
  .desc { margin: 0; color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }

  /* ---------- access code screen ---------- */
  .gate { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .gbox { width: min(360px, 100%); display: grid; gap: 12px; justify-items: center; text-align: center; }
  .gbox img { filter: drop-shadow(0 0 22px rgba(122,108,255,.6)); animation: bob 5s ease-in-out infinite; }
  .gbox h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -.03em; background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .gbox p { margin: 0; color: var(--muted); }
  .gfield { display: flex; gap: 8px; width: 100%; }
  .gfield input { flex: 1; min-width: 0; height: 52px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--panel); padding: 0 16px; font-size: 16px; outline: none; text-align: center; letter-spacing: .1em; }
  .gfield input:focus { border-color: var(--c); box-shadow: 0 0 0 3px rgba(43,212,255,.16); }
  .gfield .cta { padding: 0 20px; flex: none; }
  .gsep { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 8px; color: var(--muted); font-size: 13px; }
  .gsep::before, .gsep::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
  .gapply { display: grid; gap: 10px; width: 100%; justify-items: center; }
  .gbox, .gapply { grid-template-columns: minmax(0, 1fr); }
  /* task deck, same idea as the whitelist card: one task on top, the next slides over it when this one is done */
  .ghead { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 13px; color: var(--muted); }
  .segs { display: flex; gap: 5px; flex: 1; }
  .segs i { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); transition: background .4s, box-shadow .4s; }
  .segs i.on { background: var(--sc); box-shadow: 0 0 10px var(--sc); }
  .segs i.now { background: rgba(255,255,255,.45); }
  .gback { border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; padding: 4px 0; }
  .gback:hover { color: var(--fg, #fff); }
  .deck { position: relative; height: 150px; width: 100%; margin-bottom: 14px; text-align: left; }
  .deck::before, .deck::after { content: ""; position: absolute; left: 0; right: 0; height: 100%; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line); }
  .deck::before { transform: translateY(12px) scale(.9); opacity: .35; }
  .deck::after { transform: translateY(6px) scale(.95); opacity: .6; }
  .deck.last::before, .deck.last::after { opacity: 0; }
  .deck.one::before { opacity: 0; }
  .slip { position: absolute; inset: 0; z-index: 2; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line-2); padding: 14px; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
  .slip.enter { transform: translateY(125%); }
  .slip.enter.rev { transform: translateY(-20px) scale(.92); opacity: 0; }
  .slip.leave { transform: translateY(-14px) scale(.92); opacity: 0; z-index: 1; }
  .slip.leave.rev { transform: translateY(125%); opacity: 1; z-index: 3; }
  .slip .st { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .slip .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--on-neon); background: var(--sc); box-shadow: 0 0 14px var(--sc); }
  .slip .tt { font-size: 17px; font-weight: 600; letter-spacing: -.01em; min-width: 0; }
  .slip .hint { font-size: 12px; color: var(--muted); margin: -4px 0 0; } .slip .hint.err { color: var(--down); }
  .slip .field { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; padding: 4px 4px 4px 14px; min-width: 0; }
  .slip .field:focus-within { border-color: var(--c); box-shadow: 0 0 0 3px rgba(43,212,255,.18); }
  .slip .field span { color: var(--muted); }
  .slip .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: inherit; font: 500 16px inherit; font-family: inherit; padding: 8px 0; }
  .slip .go { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; font-size: 18px; font-weight: 700; color: var(--muted); background: rgba(255,255,255,.1); }
  .slip .field.ok .go { color: var(--on-neon); background: var(--rainbow); }
  .slip .acts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .slip .btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 18px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
  .slip .btn.line { border: 1px solid var(--line-2); color: inherit; background: none; }
  .slip .btn.line:hover { border-color: var(--c); }
  .slip .btn.done { border: 0; color: var(--on-neon); background: var(--rainbow); }
  .slip .btn[disabled] { opacity: .6; cursor: progress; }
  .slip .mini { font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .slip { transition: none; } }
  .gate { box-sizing: border-box; width: 100%; }
  .gbox .msg { min-height: 20px; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<div class="gate" id="gate" hidden>
  <div class="gbox">
    <img src="/assets/logo.webp" alt="" width="84" height="82">
    <h1>Launches</h1>
    <p>Enter your access code.</p>
    <div class="gfield"><input id="gCode" type="password" aria-label="Access code" placeholder="Access code" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="cta" id="gGo" type="button">Enter</button></div>
    <p class="msg err" id="gMsg" role="alert"></p>
    <div class="gsep"><span>No code yet?</span></div>
    <div class="gapply" id="gApply">
      <p>Finish the tasks on X to apply. Winners get a code from @giphyfun.</p>
      <div class="ghead"><button class="gback" id="aBack" type="button" hidden>← Back</button><div class="segs" id="aSegs"></div><span id="aCount"></span></div>
      <div class="deck" id="aDeck"></div>
      <p class="msg err" id="aMsg" role="alert"></p>
    </div>
    <p class="msg ok" id="aDone" hidden></p>
  </div>
</div>

<div class="wrap" id="app">
  <header class="top">
    <a class="brand" href="/"><img src="/assets/logo.webp" alt="">GiphyFun</a>
    <div class="tools">
      <label class="search" id="searchBox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Search tokens" aria-label="Search tokens" autocomplete="off"></label>
      <a class="icon" href="/" aria-label="Whitelist" title="Whitelist"><svg viewBox="0 0 24 24"><path d="M4 7.500A2.5 2.5 0 0 1 6.5 5H17v3M4 7.500V17a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6.500A2.5 2.5 0 0 1 4 7.500zM16 13.500h.01"/></svg></a>
    </div>
  </header>

  <section class="hero">
    <h1><span>Launches</span></h1>
    <div class="hrow">
      <button class="cta" id="launchBtn" type="button">Launch a token</button>
      <span class="sample">Live on Pons · Robinhood Chain</span>
    </div>
  </section>

  <section aria-labelledby="trendH" id="trendSec" hidden>
    <div class="sec">
      <h2 id="trendH">Trending</h2>
      <div class="arrows">
        <button class="icon" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></svg></button>
        <button class="icon" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="rail" id="rail"></div>
  </section>

  <section>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="mcap" aria-selected="true">Market cap</button>
      <button class="tab" role="tab" data-tab="new" aria-selected="false">New</button>
      <button class="tab" role="tab" data-tab="near" aria-selected="false">Near graduation</button>
      <button class="tab" role="tab" data-tab="grad" aria-selected="false">Graduated</button>
      <button class="tab" role="tab" data-tab="fee" aria-selected="false">Highest fee</button>
      <span class="ink" id="ink"></span>
    </div>
    <div class="filters">
      <div class="view" role="group" aria-label="View">
        <button type="button" id="vList" aria-pressed="true" aria-label="List view"><svg viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg></button>
        <button type="button" id="vGrid" aria-pressed="false" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="6" height="6" rx="1.5"/><rect x="13.5" y="4.5" width="6" height="6" rx="1.5"/><rect x="4.5" y="13.5" width="6" height="6" rx="1.5"/><rect x="13.5" y="13.5" width="6" height="6" rx="1.5"/></svg></button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetH"></div>
</div>

<script>
/* Coins come from /api/coins (launched from this site on Pons). GIFs live on IPFS. */
const GATEWAY = 'https://gateway.pinata.cloud/ipfs/';
const PONS = 'https://ponsfamily.com/launchpad/';
const MAX_GIF = 3 * 1024 * 1024;
const C = ['#ffe95a','#7cff6b','#2bd4ff','#7a6cff','#e04bff','#ff5fa2'];

let TOKENS = [], OPEN = false, loaded = false;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const age = ts => { const m = (Date.now() - ts) / 60000; return m < 60 ? Math.max(1, Math.round(m)) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : m < 43200 ? Math.round(m / 1440) + 'd' : Math.round(m / 43200) + 'mo'; };
const fee = bps => (bps / 100).toFixed(bps % 100 ? 1 : 0) + '% fee';
const money = t => t.mcapUsd != null ? '$' + compact(t.mcapUsd) : t.mcapEth != null ? compact(t.mcapEth) + ' ETH' : '—';
const compact = n => n >= 1e9 ? (n/1e9).toFixed(1) + 'B' : n >= 1e6 ? (n/1e6).toFixed(1) + 'M' : n >= 1e3 ? (n/1e3).toFixed(1) + 'K' : n >= 10 ? n.toFixed(0) : n.toFixed(2);
const pct = c => c == null ? '' : (c > 0 ? '+' : '') + c.toFixed(1) + '%';
const cls = c => c < 0 ? 'down' : 'up';
const short = a => a.slice(0, 6) + '…' + a.slice(-4);
const art = t => `<img src="${GATEWAY}${encodeURIComponent(t.cid)}" alt="" loading="lazy">`;
const store = { get(k){ try { return localStorage.getItem('gfl_'+k); } catch { return null; } }, set(k,v){ try { localStorage.setItem('gfl_'+k, v); } catch {} } };
let ui = { tab:'mcap', q:'', view: store.get('view') === 'grid' ? 'grid' : 'list' };

async function load(){
  try {
    const r = await fetch('/api/coins'); const j = await r.json();
    if (r.status === 401) return showGate();
    TOKENS = (j.coins || []).map((t, i) => ({ ...t, id: i, a: C[i % 6], b: C[(i + 2) % 6] })); OPEN = !!j.open;
    if (!TOKENS.length && !j.coins) throw 0;
  } catch { TOKENS = []; }
  loaded = true; drawRail(); drawList();
}

/* ---------- latest rail ---------- */
function drawRail(){
  const top = [...TOKENS].sort((a,b) => (b.chg ?? -1e9) - (a.chg ?? -1e9) || b.ts - a.ts).slice(0, 8);
  $('#trendSec').hidden = !top.length;
  $('#rail').innerHTML = top.map((t, i) => `
    <button class="tcard" type="button" data-id="${t.id}">
      <div class="art" style="--d:${(-i * .7).toFixed(1)}s"><div class="coin">${art(t)}</div></div>
      <div class="tmeta">
        <div class="tname"><i>${i + 1}</i><b>${esc(t.name)}</b></div>
        <div class="tnum"><strong>${money(t)}</strong><span class="chg ${cls(t.chg)}">${pct(t.chg)}</span></div>
      </div>
    </button>`).join('');
}
const rail = $('#rail');
const step = () => (rail.querySelector('.tcard')?.offsetWidth || 220) + 14;
$('#prev').addEventListener('click', () => rail.scrollBy({ left: -step() * 2, behavior: 'smooth' }));
$('#next').addEventListener('click', () => rail.scrollBy({ left: step() * 2, behavior: 'smooth' }));

/* ---------- list ---------- */
function visible(){
  const r = TOKENS.filter(t => !ui.q || (t.name + ' ' + t.symbol + ' ' + t.token).toLowerCase().includes(ui.q));
  let r2 = r;
  if (ui.tab === 'mcap') r2.sort((a,b) => (b.mcapEth ?? -1) - (a.mcapEth ?? -1));
  if (ui.tab === 'new') r2.sort((a,b) => b.ts - a.ts);
  if (ui.tab === 'near') r2 = r2.filter(t => !t.grad).sort((a,b) => (b.prog ?? 0) - (a.prog ?? 0));
  if (ui.tab === 'grad') r2 = r2.filter(t => t.grad).sort((a,b) => (b.mcapEth ?? 0) - (a.mcapEth ?? 0));
  if (ui.tab === 'fee') r2.sort((a,b) => b.feeBps - a.feeBps || b.ts - a.ts);
  return r2;
}
function drawList(){
  const r = visible(), el = $('#list');
  el.classList.toggle('grid', ui.view === 'grid' && r.length > 0);
  $('#count').textContent = loaded ? r.length + (r.length === 1 ? ' coin' : ' coins') : '';
  el.innerHTML = r.length ? r.map((t, i) => `
    <button class="row" type="button" data-id="${t.id}" style="--i:${Math.min(i, 12)}">
      <span class="ava" style="--a:${t.a};--b:${t.b}">${art(t)}</span>
      <span class="info">
        <span class="nm"><b>${esc(t.name)}</b><span class="tk">$${esc(t.symbol)}</span></span>
        <span class="sub"><span>${age(t.ts)}</span><span>${fee(t.feeBps)}</span>${t.grad ? '<span class="grad">Graduated</span>' : t.prog != null ? `<span class="bar" title="${t.prog.toFixed(0)}% to graduation"><i style="width:${t.prog}%"></i></span><span>${t.prog.toFixed(0)}%</span>` : ''}</span>
      </span>
      <span class="val"><strong>${money(t)}</strong><span class="chg ${cls(t.chg)}">${pct(t.chg)}</span></span>
    </button>`).join('')
    : `<div class="empty">${!loaded ? 'Loading coins…' : TOKENS.length ? 'No coins here yet.' : 'No coins yet. Launch the first one.'}</div>`;
}
function moveInk(){
  const t = $('.tab[aria-selected="true"]'), ink = $('#ink');
  ink.style.width = t.offsetWidth - 28 + 'px'; ink.style.transform = 'translateX(' + (t.offsetLeft + 14) + 'px)';
}
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b === t));
  ui.tab = t.dataset.tab; moveInk(); drawList();
});
$('#q').addEventListener('input', e => { ui.q = e.target.value.trim().toLowerCase(); drawList(); });
$('#searchBox').addEventListener('click', () => { $('#searchBox').classList.add('open'); $('#q').focus(); });
$('#q').addEventListener('blur', () => { if (!$('#q').value) $('#searchBox').classList.remove('open'); });
function setView(v){ ui.view = v; store.set('view', v); $('#vList').setAttribute('aria-pressed', v === 'list'); $('#vGrid').setAttribute('aria-pressed', v === 'grid'); drawList(); }
$('#vList').addEventListener('click', () => setView('list'));
$('#vGrid').addEventListener('click', () => setView('grid'));

/* ---------- sheets ---------- */
const scrim = $('#scrim'), sheet = $('#sheet');
let lastFocus = null, busy = false;
const X = '<button class="icon" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
function openSheet(html){ lastFocus = document.activeElement; sheet.innerHTML = html; scrim.hidden = false; (sheet.querySelector('input[type=text]') || sheet.querySelector('[data-close]')).focus(); }
function closeSheet(){ if (busy) return; scrim.hidden = true; sheet.innerHTML = ''; if (lastFocus) lastFocus.focus(); }
scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) closeSheet(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden) closeSheet(); });

function tokenSheet(t){
  openSheet(`
    <div class="sh"><h3 id="sheetH">${esc(t.name)} <span class="tk">$${esc(t.symbol)}</span></h3>${X}</div>
    <div class="prev"><span class="ava" style="--a:${t.a};--b:${t.b}">${art(t)}</span>
      <span class="info"><b>${fee(t.feeBps)}</b><span class="sub">Launched ${age(t.ts)} ago · ETH pair</span></span></div>
    <div class="stats">
      <div class="stat"><span>Market cap</span><b>${money(t)}</b></div>
      <div class="stat"><span>24h</span><b class="chg ${cls(t.chg)}">${pct(t.chg) || '—'}</b></div>
      <div class="stat"><span>Graduation</span><b>${t.grad ? 'Done' : t.prog != null ? t.prog.toFixed(0) + '%' : '—'}</b></div>
    </div>
    ${t.description ? `<p class="desc">${esc(t.description)}</p>` : ''}
    <div class="f">Contract<span class="addr">${esc(t.token)}</span></div>
    <a class="cta" style="text-align:center;text-decoration:none;display:block" href="${PONS}${encodeURIComponent(t.token)}" target="_blank" rel="noopener">Trade on Pons ↗</a>`);
}

function launchSheet(){
  openSheet(`
    <div class="sh"><h3 id="sheetH">Launch a coin</h3>${X}</div>
    <label class="drop" id="drop" for="fGif"><span class="ava" id="pAva" style="--a:${C[0]};--b:${C[2]}">?</span>
      <span><b id="gName">Add a GIF</b><span id="gHint">GIF only, up to 3 MB</span></span>
      <input id="fGif" type="file" accept="image/gif,.gif"></label>
    <div class="two">
      <label class="f" for="fName">Name<input id="fName" type="text" maxlength="32" placeholder="Plushie" autocomplete="off"></label>
      <label class="f" for="fTick">Ticker<input id="fTick" type="text" maxlength="10" placeholder="PLUSH" autocomplete="off" autocapitalize="characters"></label>
    </div>
    <label class="f" for="fDesc">Description<textarea id="fDesc" rows="2" maxlength="280" placeholder="What is it about?"></textarea></label>
    <label class="f" for="fFee">Creator fee on each trade (max 9%)
      <span class="feeRow"><input id="fFee" type="range" min="0" max="9" step="0.5" value="1"><output id="fFeeOut" for="fFee">1%</output></span></label>
    <label class="f" for="fPay">Where your fees go (Robinhood wallet address)<input id="fPay" type="text" maxlength="42" placeholder="0x…" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:14px"></label>
    <button class="cta" id="fGo" type="button" style="width:100%">Launch on Pons</button>
    <p class="msg" id="fMsg">${OPEN ? 'Free to launch. Your coin goes live on Pons right away.' : 'Launching is not open yet.'}</p>`);
  const n = $('#fName'), k = $('#fTick'), f = $('#fFee'), g = $('#fGif'), pay = $('#fPay'), msg = $('#fMsg'), go = $('#fGo');
  let gif = null;
  const say = (t, c) => { msg.textContent = t; msg.className = 'msg' + (c ? ' ' + c : ''); };
  k.addEventListener('input', () => { k.value = k.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  f.addEventListener('input', () => { $('#fFeeOut').textContent = (+f.value) + '%'; });
  async function take(file){
    gif = null;
    if (!file) return;
    const head = new Uint8Array(await file.slice(0, 6).arrayBuffer());
    const sig = String.fromCharCode(...head);
    if (sig !== 'GIF89a' && sig !== 'GIF87a') return say('Only GIF files are accepted.', 'err');
    if (file.size > MAX_GIF) return say('The GIF must be 3 MB or smaller.', 'err');
    gif = file; $('#pAva').innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`;
    $('#gName').textContent = file.name; $('#gHint').textContent = (file.size / 1048576).toFixed(2) + ' MB';
    say(OPEN ? 'Free to launch. Your coin goes live on Pons right away.' : 'Launching is not open yet.');
  }
  g.addEventListener('change', () => take(g.files[0]));
  const drop = $('#drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]); });
  const b64 = file => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(file); });

  go.addEventListener('click', async () => {
    if (busy) return;
    if (!gif) return say('Add a GIF for your coin.', 'err');
    if (n.value.trim().length < 2) { n.focus(); return say('Give your coin a name.', 'err'); }
    if (k.value.length < 2) { k.focus(); return say('Add a ticker, like PLUSH.', 'err'); }
    if (!/^0x[a-fA-F0-9]{40}$/.test(pay.value.trim())) { pay.focus(); return say('Enter a valid Robinhood wallet address (0x…).', 'err'); }
    busy = true; go.disabled = true; go.textContent = 'Launching…'; say('Creating your coin on Pons. This can take up to a minute. Keep this open.');
    try {
      const r = await fetch('/api/launch', { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ name: n.value.trim(), symbol: k.value, description: $('#fDesc').value.trim(), feePct: +f.value, payout: pay.value.trim(), gif: await b64(gif) }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Could not launch. Nothing was created. Try again.');
      busy = false;
      openSheet(`
        <div class="sh"><h3 id="sheetH">${esc(n.value.trim())} is live</h3>${X}</div>
        <p class="msg ok">${j.confirmed ? 'Your coin was created on Pons.' : 'Your launch was sent and is confirming.'}</p>
        <div class="f">Contract<span class="addr">${esc(j.token)}</span></div>
        <a class="cta" style="text-align:center;text-decoration:none;display:block" href="${esc(j.url)}" target="_blank" rel="noopener">Open on Pons ↗</a>`);
      load();
    } catch (e) {
      say(e.message === 'Failed to fetch' ? 'No connection. Nothing was created. Try again.' : e.message, 'err');
      go.disabled = false; go.textContent = 'Launch on Pons';
    } finally { busy = false; }
  });
}
$('#launchBtn').addEventListener('click', launchSheet);
document.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) tokenSheet(TOKENS[+b.dataset.id]); });

/* ---------- access code + X tasks to apply for one ---------- */
/* The comment task only opens X: people write their own words. Until POST_URL has a post link, post tasks open the profile. */
const XCFG = { handle: 'giphyfun', POST_URL: 'https://x.com/giphyfun/status/2120477424144032069' };
const xProfile = 'https://x.com/' + XCFG.handle;
const xPostId = (XCFG.POST_URL.match(/status\/(\d+)/) || [])[1] || '';
const xPost = xPostId ? XCFG.POST_URL : xProfile;
const GTASKS = [
  { id:'follow', t:'Follow @' + XCFG.handle, href:xProfile },
  { id:'bell',   t:'Turn on notifications', href:xProfile },
  { id:'like',   t:'Like the post', href:xPost },
  { id:'rt',     t:'Repost', href:xPost },
  { id:'reply',  t:'Comment', hint:'Write it in your own words.', href:xPostId ? 'https://x.com/intent/post?in_reply_to=' + xPostId : xProfile }
];
/* progress is tied to the post, so a new post link asks for the tasks again */
/* bump ROUND to make everyone do the tasks again */
const ROUND = 2;
const gKey = 'tasks_r' + ROUND + '_' + (xPostId || 'profile');
let gDone = new Set((store.get(gKey) || '').split(',').filter(Boolean));
const validX = u => /^[A-Za-z0-9_]{1,15}$/.test(u);
const SEGC = ['#ffe95a','#7cff6b','#2bd4ff','#7a6cff','#e04bff','#ff5fa2'];
/* step 0 is the username, then one task at a time */
const ASTEPS = [{ id:'user', t:'Your X username' }, ...GTASKS];
const AN = ASTEPS.length;
let aUser = store.get('xuser') || '';
let aStep = Math.min(AN - 1, +store.get('step_' + gKey) || 0); if (!validX(aUser)) aStep = 0;
const aDeck = $('#aDeck'), noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#aSegs').innerHTML = ASTEPS.map((_, i) => `<i style="--sc:${SEGC[i % 6]}"></i>`).join('');

function fillSlip(el, i){
  const st = ASTEPS[i];
  const head = `<div class="st"><span class="num">${i + 1}</span><span class="tt">${st.t}</span></div>`;
  if (st.id === 'user') {
    el.innerHTML = head + `<div class="field"><span>@</span><input type="text" placeholder="username" aria-label="Your X username" maxlength="16" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="go" type="button" aria-label="Continue">→</button></div><p class="hint"></p>`;
    const field = el.querySelector('.field'), input = el.querySelector('input'), hint = el.querySelector('.hint');
    const clean = () => input.value.trim().replace(/^@/, '');
    input.value = aUser;
    const sync = () => { field.classList.toggle('ok', validX(clean())); hint.textContent = ''; hint.classList.remove('err'); };
    const submit = () => {
      if (!validX(clean())) { hint.textContent = '1–15 letters, numbers or _'; hint.classList.add('err'); input.focus(); return; }
      aUser = clean(); store.set('xuser', aUser); aNext();
    };
    input.addEventListener('input', sync);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    el.querySelector('.go').addEventListener('click', submit);
    sync();
  } else {
    const opened = gDone.has(st.id);
    el.innerHTML = head + (st.hint ? `<p class="hint">${st.hint}</p>` : '') + (opened
      ? `<div class="acts"><button class="btn done" type="button">✓ Done</button><a class="mini" href="${st.href}" target="_blank" rel="noopener">Open again ↗</a></div>`
      : `<div class="acts"><a class="btn line" href="${st.href}" target="_blank" rel="noopener">Open on X ↗</a></div>`);
    el.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      if (gDone.has(st.id)) return;
      gDone.add(st.id); store.set(gKey, [...gDone].join(','));
      setTimeout(() => { if (aStep === i && el.isConnected) fillSlip(el, i); }, 350);
    }));
    const done = el.querySelector('.done'); if (done) done.addEventListener('click', () => aNext(done));
  }
}
function aChrome(){
  [...$('#aSegs').children].forEach((el, i) => { el.classList.toggle('on', i < aStep); el.classList.toggle('now', i === aStep); });
  $('#aCount').textContent = (aStep + 1) + ' / ' + AN;
  $('#aBack').hidden = aStep === 0;
  aDeck.classList.toggle('last', aStep >= AN - 1); aDeck.classList.toggle('one', aStep === AN - 2);
}
function showStep(i, dir){
  const old = aDeck.querySelector('.slip:not(.leave)');
  const el = document.createElement('div');
  el.className = 'slip'; el.style.setProperty('--sc', SEGC[i % 6]);
  fillSlip(el, i);
  if (old && dir && !noMotion) {
    el.classList.add('enter'); if (dir < 0) el.classList.add('rev');
    aDeck.appendChild(el); void el.offsetWidth; el.classList.remove('enter', 'rev');
    old.classList.add('leave'); if (dir < 0) old.classList.add('rev');
    old.querySelectorAll('a, button, input').forEach(n => n.tabIndex = -1);
    setTimeout(() => old.remove(), 520);
  } else { if (old) old.remove(); aDeck.appendChild(el); }
  aChrome();
}
function aNext(btn){
  if (aStep < AN - 1) { aStep++; store.set('step_' + gKey, aStep); $('#aMsg').textContent = ''; return showStep(aStep, 1); }
  apply(btn);
}
$('#aBack').addEventListener('click', () => { if (aStep > 0) { aStep--; store.set('step_' + gKey, aStep); $('#aMsg').textContent = ''; showStep(aStep, -1); } });
function showApplied(u){
  $('#gApply').hidden = true; const d = $('#aDone'); d.hidden = false;
  d.textContent = 'Applied as @' + u + '. Winners get their code from @' + XCFG.handle + ' on X.';
}
/* Last task done: save the application. */
async function apply(btn){
  const msg = $('#aMsg');
  if (btn) btn.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/apply', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ user: aUser, tasks: [...gDone] }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = j.error || 'Could not save. Try again.'; if (btn) btn.disabled = false; return; }
    store.set('applied_' + gKey, aUser); showApplied(aUser);
  } catch { msg.textContent = 'No connection. Try again.'; if (btn) btn.disabled = false; }
}

function showGate(){
  const g = $('#gate'); if (!g.hidden) return;
  g.hidden = false; $('#app').hidden = true;
  const u = store.get('applied_' + gKey); if (u) showApplied(u); else showStep(aStep, 0);
}
async function tryCode(){
  const inp = $('#gCode'), msg = $('#gMsg'), btn = $('#gGo');
  if (!inp.value.trim()) { inp.focus(); return; }
  btn.disabled = true; msg.textContent = '';
  try {
    const r = await fetch('/api/gate', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ code: inp.value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = j.error || 'Wrong code.'; inp.select(); return; }
    $('#gate').hidden = true; $('#app').hidden = false; inp.value = ''; moveInk(); load();
  } catch { msg.textContent = 'No connection. Try again.'; }
  finally { btn.disabled = false; }
}
$('#gGo').addEventListener('click', tryCode);
$('#gCode').addEventListener('keydown', e => { if (e.key === 'Enter') tryCode(); });

/* ---------- boot ---------- */
setView(ui.view); moveInk(); load();
/* Refresh the numbers every 30 seconds while the page is visible and no sheet is open. */
setInterval(() => { if (!document.hidden && scrim.hidden) load(); }, 30000);
addEventListener('resize', moveInk);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInk);
</script>
</body>
